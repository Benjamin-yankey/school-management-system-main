# Render Blueprint — School Management System backend (free-tier layout)
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys the NestJS services in ./backend-fixed entirely on Render's FREE tier:
#   api-gateway (public) -> auth/user/school/notification -> Postgres + Redis
#
# Architecture note:
#   Inter-service calls are plain HTTP (no Kafka/Redpanda). Services reach each
#   other over Render's private network using the service name + port, e.g.
#   http://auth-service:3001. The internal endpoints are guarded by a shared
#   INTERNAL_KEY secret (see the `school-shared` env group).
#
# Free-tier caveats:
#   - Free web services SPIN DOWN after ~15 min idle; the first request after
#     idle cold-starts the service (and any service it calls). Pre-warm before demos.
#   - The free Postgres instance EXPIRES after 30 days — recreate or upgrade.
#
# How to use:
#   1. Push this file to the repo root.
#   2. Render Dashboard -> New -> Blueprint -> pick this repo.
#   3. Fill the env vars marked `sync: false` (secrets) when prompted.
#   4. After the gateway is live, copy its URL and set VITE_API_URL on Netlify,
#      then set FRONTEND_URL on api-gateway to the Netlify site URL (CORS).

databases:
  - name: school-db
    databaseName: school_db
    user: school_user
    plan: free            # `free` expires after 30 days — upgrade for production
    region: oregon

envVarGroups:
  - name: school-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true   # generated once, shared by all services below
      - key: INTERNAL_KEY
        generateValue: true   # shared secret guarding service-to-service HTTP calls

services:
  # ─── Redis (Key Value) ────────────────────────────────────────────────────
  - type: keyvalue
    name: redis
    plan: free
    region: oregon
    ipAllowList: []          # empty = internal network only
    maxmemoryPolicy: noeviction

  # ─── auth-service (:3001) ─────────────────────────────────────────────────
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend-fixed/auth-service/Dockerfile
    dockerContext: ./backend-fixed/auth-service
    region: oregon
    envVars:
      - fromGroup: school-shared
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: USER_SERVICE_URL
        value: http://user-service:3002

  # ─── user-service (:3002) ─────────────────────────────────────────────────
  - type: web
    name: user-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend-fixed/user-service/Dockerfile
    dockerContext: ./backend-fixed/user-service
    region: oregon
    envVars:
      - fromGroup: school-shared
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: SCHOOL_SERVICE_URL
        value: http://school-service:3003
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:3004

  # ─── school-service (:3003) ───────────────────────────────────────────────
  - type: web
    name: school-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend-fixed/school-service/Dockerfile
    dockerContext: ./backend-fixed/school-service
    region: oregon
    envVars:
      - fromGroup: school-shared
      - key: PORT
        value: "3003"
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString

  # ─── notification-service (:3004) ─────────────────────────────────────────
  - type: web
    name: notification-service
    runtime: docker
    plan: free
    dockerfilePath: ./backend-fixed/notification-service/Dockerfile
    dockerContext: ./backend-fixed/notification-service
    region: oregon
    envVars:
      - fromGroup: school-shared
      - key: PORT
        value: "3004"
      - key: DATABASE_URL
        fromDatabase:
          name: school-db
          property: connectionString
      - key: USE_GATEWAY
        value: "true"
      - key: API_GATEWAY_URL
        value: http://api-gateway:3000
      - key: USER_SERVICE_URL
        value: http://user-service:3002
      - key: SCHOOL_SERVICE_URL
        value: http://school-service:3003
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false

  # ─── api-gateway (public web service, :3000) ──────────────────────────────
  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./backend-fixed/api-gateway/Dockerfile
    dockerContext: ./backend-fixed/api-gateway
    region: oregon
    healthCheckPath: /
    envVars:
      - fromGroup: school-shared
      - key: PORT
        value: "3000"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: redis
          property: connectionString
      - key: AUTH_SERVICE_URL
        value: http://auth-service:3001
      - key: USER_SERVICE_URL
        value: http://user-service:3002
      - key: SCHOOL_SERVICE_URL
        value: http://school-service:3003
      - key: NOTIFICATION_SERVICE_URL
        value: http://notification-service:3004
      # CORS: set this to your Netlify site URL after the frontend deploys
      - key: FRONTEND_URL
        sync: false
