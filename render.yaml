# Render Blueprint — School Management System (monolithic backend).
# Docs: https://render.com/docs/blueprint-spec
#
# One web service runs the whole backend (auth + user + school + notification).
# What used to be 5 Docker services talking over HTTP is now a single NestJS
# app: the modules call each other in-process, so there is no api-gateway, no
# INTERNAL_KEY, and no per-service URLs.
#
# Database:
#   The single Postgres holds four schemas (auth / user / school / notification);
#   the app creates them on boot if missing. Reusing an EXISTING free Postgres +
#   Key Value (Redis): this account already has one of each on the free tier, so
#   we don't declare a `databases:` block — paste DATABASE_URL / REDIS_URL once
#   at sync time instead.
#
# Free-tier caveat:
#   Free web services SPIN DOWN after ~15 min idle; the first request cold-starts
#   the service. Pre-warm before demos.
#
# How to use:
#   1. Push this file to the repo root.
#   2. Render -> Blueprint -> sync. When prompted, paste DATABASE_URL (existing
#      Postgres Internal URL), REDIS_URL (existing Key Value Internal URL), the
#      superadmin seed, the mail credentials, and CORS_ORIGINS.
#   3. After the backend is live, point each frontend's VITE_API_URL at its URL,
#      and put those frontend origins in CORS_ORIGINS (comma-separated).

envVarGroups:
  - name: school-shared
    envVars:
      - key: JWT_SECRET
        generateValue: true   # generated once on first sync
      - key: DATABASE_URL
        sync: false           # paste your existing free Postgres Internal URL
      - key: REDIS_URL
        sync: false           # paste your existing free Key Value (Redis) Internal URL

services:
  # ─── school-backend (public web service, :3000) ───────────────────────────
  - type: web
    name: school-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /metrics
    envVars:
      - fromGroup: school-shared   # JWT_SECRET, DATABASE_URL, REDIS_URL
      - key: PORT
        value: "3000"
      # Superadmin seeded on first boot if none exists
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # CORS: comma-separated list of frontend origins (Netlify site URLs)
      - key: CORS_ORIGINS
        sync: false
      # Mail (notification module)
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
